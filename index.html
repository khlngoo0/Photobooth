<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Photoism Style Photobooth</title>

<meta name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<style>
body {
  margin: 0;
  background: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
  text-align: center;
  touch-action: manipulation;
  user-select: none;
}

.camera {
  position: relative;
}

video {
  width: 100vw;
  max-height: 65vh;
  background: black;
  transform: scaleX(-1); /* mirror selfie preview */
}

.flash {
  position: absolute;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
}

.flash.active {
  animation: flash 0.18s;
}

@keyframes flash {
  from { opacity: 1; }
  to { opacity: 0; }
}

.countdown {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4.5rem;
  font-weight: 600;
  color: white;
  text-shadow: 0 0 12px black;
}

/* PHOTOISM STRIP */
.strip {
  width: 240px;
  margin: 20px auto;
  padding: 12px 10px;
  background: white;
  border-radius: 14px;
}

.slot {
  width: 220px;
  height: 140px;
  margin: 10px auto;
  background: #000;
  border-radius: 8px;
  background-size: cover;
  background-position: center;
}
</style>
</head>

<body>

<div class="camera">
  <video id="video" autoplay playsinline></video>
  <div class="flash" id="flash"></div>
  <div class="countdown" id="countdown"></div>
</div>

<div class="strip" id="strip">
  <div class="slot"></div>
  <div class="slot"></div>
  <div class="slot"></div>
  <div class="slot"></div>
</div>

<canvas id="canvas" hidden></canvas>
<audio id="shutter" src="https://cdn.jsdelivr.net/gh/jshawl/AudioFX/sounds/camera-shutter-click-03.mp3"></audio>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const slots = document.querySelectorAll(".slot");
const countdownEl = document.getElementById("countdown");
const flash = document.getElementById("flash");
const shutter = document.getElementById("shutter");

let busy = false;
let index = 0;

/* FRONT CAMERA ONLY */
navigator.mediaDevices.getUserMedia({
  video: { facingMode: "user" },
  audio: false
}).then(stream => video.srcObject = stream);

/* unlock audio (iOS requirement) */
document.body.addEventListener("touchstart", () => {
  shutter.play().then(() => {
    shutter.pause();
    shutter.currentTime = 0;
  });
}, { once: true });

/* tap anywhere to start */
document.body.addEventListener("touchstart", async () => {
  if (busy) return;
  busy = true;
  index = 0;
  slots.forEach(s => s.style.backgroundImage = "");

  for (let i = 0; i < 4; i++) {
    await countdown(3);
    capture();
  }

  setTimeout(() => busy = false, 25000);
});

/* countdown */
function countdown(n) {
  return new Promise(resolve => {
    countdownEl.textContent = n;
    const t = setInterval(() => {
      n--;
      if (n === 0) {
        clearInterval(t);
        countdownEl.textContent = "";
        resolve();
      } else {
        countdownEl.textContent = n;
      }
    }, 1000);
  });
}

/* PHOTOISM camera shot look */
function drawPhotoismFrame() {
  /* white inner border */
  ctx.lineWidth = canvas.width * 0.035;
  ctx.strokeStyle = "#ffffff";
  ctx.strokeRect(
    ctx.lineWidth / 2,
    ctx.lineWidth / 2,
    canvas.width - ctx.lineWidth,
    canvas.height - ctx.lineWidth
  );

  /* soft vignette */
  const g = ctx.createRadialGradient(
    canvas.width / 2,
    canvas.height / 2,
    canvas.width / 4,
    canvas.width / 2,
    canvas.height / 2,
    canvas.width / 1.1
  );
  g.addColorStop(0, "transparent");
  g.addColorStop(1, "rgba(0,0,0,0.25)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  /* date text */
  ctx.font = `${canvas.width * 0.035}px Helvetica`;
  ctx.fillStyle = "#ffffff";
  ctx.textAlign = "center";
  ctx.fillText(
    new Date().toISOString().slice(0,10),
    canvas.width / 2,
    canvas.height - canvas.width * 0.04
  );
}

/* capture */
function capture() {
  flash.classList.add("active");
  shutter.currentTime = 0;
  shutter.play();

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  /* mirrored selfie draw */
  ctx.save();
  ctx.scale(-1, 1);
  ctx.filter = "contrast(1.05)";
  ctx.drawImage(video, -canvas.width, 0);
  ctx.restore();

  /* photoism look */
  drawPhotoismFrame();

  slots[index].style.backgroundImage =
    `url(${canvas.toDataURL("image/png")})`;

  index++;
  setTimeout(() => flash.classList.remove("active"), 180);
}
</script>

</body>
</html>
