<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Take a Photo with Hugo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
  text-align: center;
  background: #fff;
}

#logo {
  font-family: "Dancing Script", cursive;
  font-size: 2.2rem;
  line-height: 1.2;
  margin: 12px 0;
}

#live-window {
  position: relative;
  width: 100vw;
  max-height: 70vh;
  margin: 0 auto;
  overflow: hidden;
  border-radius: 14px;
  touch-action: manipulation;
}

#video {
  width: 100%;
  transform: scaleX(-1);
  display: block;
}

#overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none; /* allows tap to pass through */
  object-fit: cover;
  opacity: 1;
}

#footer-date {
  font-size: 0.9rem;
  color: #555;
  margin: 8px 0 20px 0;
}
</style>
</head>
<body>

<header id="logo">Take a Photo<br>with Hugo</header>

<div id="live-window">
  <video id="video" autoplay playsinline></video>
  <img id="overlay" src="" alt="Overlay">
</div>

<footer id="footer-date"></footer>

<canvas id="canvas" hidden></canvas>
<audio id="shutter" src="https://cdn.jsdelivr.net/gh/jshawl/AudioFX/sounds/camera-shutter-click-03.mp3"></audio>

<script>
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const shutter = document.getElementById("shutter");
const footer = document.getElementById("footer-date");

// Access front camera
navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
  .then(stream => {
    video.srcObject = stream;
    video.addEventListener('loadedmetadata', () => {
      video.play();
    });
  })
  .catch(err => alert("Camera access denied: " + err));

// Unlock iOS audio
document.body.addEventListener("touchstart", () => {
  shutter.play().then(() => { shutter.pause(); shutter.currentTime = 0; });
}, { once: true });

// Tap window to capture
document.getElementById("live-window").addEventListener("click", capture);

function capture() {
  shutter.currentTime = 0;
  shutter.play();

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  ctx.save();
  ctx.scale(-1,1); // mirror
  ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
  ctx.restore();

  // Convert to image URL
  const dataURL = canvas.toDataURL("image/png");

  // Automatically download captured photo
  const a = document.createElement("a");
  a.href = dataURL;
  a.download = `photo-${Date.now()}.png`;
  a.click();

  // Optional: log for debugging
  console.log("Captured photo:", dataURL);
}

// Footer date/time without seconds
function updateFooterDateTime() {
  const now = new Date();
  const options = { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false };
  footer.textContent = now.toLocaleString(undefined, options);
}
updateFooterDateTime();
setInterval(updateFooterDateTime, 60000);
</script>

</body>
</html>
