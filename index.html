<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Overlay Photobooth</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<!-- Google Font for logo -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #fff;
  font-family: -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
  text-align: center;
  touch-action: manipulation;
  user-select: none;
}

/* Logo at top */
#logo {
  font-family: "Dancing Script", cursive;
  font-size: 2.5rem;
  color: #222;
  margin: 12px 0;
  letter-spacing: 1px;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
}

/* Live photo window */
#live-window {
  position: relative;
  width: 100vw;
  max-height: 70vh;
  margin: 0 auto;
  background: black;
  overflow: hidden;
  border-radius: 14px;
}

/* Video feed */
#video {
  width: 100%;
  transform: scaleX(-1); /* mirror selfie */
  display: block;
}

/* Overlay your photo on top of video */
#overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  object-fit: cover;
  opacity: 1;
}

/* Footer date/time */
#footer-date {
  font-family: Helvetica, Arial, sans-serif;
  font-size: 0.9rem;
  color: #555;
  text-align: center;
  margin: 8px 0 20px 0;
}
</style>
</head>
<body>

<header id="logo">Hugo</header>

<div id="live-window">
  <video id="video" autoplay playsinline></video>
  <img id="overlay" src="my-photo.png" alt="Overlay">
</div>

<footer id="footer-date"></footer>

<canvas id="canvas" hidden></canvas>
<audio id="shutter" src="https://cdn.jsdelivr.net/gh/jshawl/AudioFX/sounds/camera-shutter-click-03.mp3"></audio>

<script>
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const shutter = document.getElementById("shutter");
const footer = document.getElementById("footer-date");

/* Front camera */
navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
  .then(stream => video.srcObject = stream);

/* Unlock audio on iOS */
document.body.addEventListener("touchstart", () => {
  shutter.play().then(() => { shutter.pause(); shutter.currentTime = 0; });
}, { once: true });

/* Tap anywhere on live window to capture */
document.getElementById("live-window").addEventListener("click", () => capture());

/* Capture function */
function capture() {
  shutter.currentTime = 0;
  shutter.play();

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  // Mirror selfie
  ctx.save();
  ctx.scale(-1,1);
  ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
  ctx.restore();

  // Draw overlay photo full-size
  const overlayImg = new Image();
  overlayImg.src = "my-photo.png";
  overlayImg.onload = () => {
    ctx.drawImage(overlayImg, 0, 0, canvas.width, canvas.height);

    // Optional: date/time on photo
    const now = new Date();
    const options = { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false };
    ctx.font = `${canvas.width * 0.035}px Helvetica`;
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.fillText(now.toLocaleString(undefined, options), canvas.width/2, canvas.height - canvas.width*0.04);

    // Show captured photo in the live window
    overlay.src = canvas.toDataURL("image/png");
  };
}

/* Footer date/time live (no seconds) */
function updateFooterDateTime() {
  const now = new Date();
  const options = { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false };
  footer.textContent = now.toLocaleString(undefined, options);
}
updateFooterDateTime();
setInterval(updateFooterDateTime, 60000);
</script>

</body>
</html>
