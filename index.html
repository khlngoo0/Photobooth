<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Take a Photo with Hugo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<!-- Google Font for cursive header -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
  text-align: center;
  background: #fff;
}

#logo {
  font-family: "Dancing Script", cursive;
  font-size: 2.2rem;
  line-height: 1.2;
  margin: 12px 0;
  color: #222;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
}

#live-window {
  position: relative;
  width: 100vw;
  max-height: 70vh;
  margin: 0 auto;
  overflow: hidden;
  border-radius: 14px;
  touch-action: manipulation;
}

#video {
  width: 100%;
  transform: scaleX(-1);
  display: block;
}

#overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 60%;
  pointer-events: none; /* clicks pass through */
  object-fit: cover;
  opacity: 1;
}

#footer-date {
  font-size: 0.9rem;
  color: #555;
  margin: 8px 0 20px 0;
}
</style>
</head>
<body>

<header id="logo">
Take a Photo<br>with Hugo
</header>

<div id="live-window">
  <video id="video" autoplay playsinline></video>
  <img id="overlay" src="my-photo.png" alt="Overlay">
</div>

<footer id="footer-date"></footer>

<canvas id="canvas" hidden></canvas>
<audio id="shutter" src="https://cdn.jsdelivr.net/gh/jshawl/AudioFX/sounds/camera-shutter-click-03.mp3"></audio>

<script>
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const shutter = document.getElementById("shutter");
const footer = document.getElementById("footer-date");
const headerText = document.getElementById("logo").innerText;

/* Front camera */
navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
  .then(stream => {
    video.srcObject = stream;
    video.addEventListener('loadedmetadata', () => video.play());
  })
  .catch(err => alert("Camera access denied: " + err));

/* Unlock audio on iOS */
document.body.addEventListener("touchstart", () => {
  shutter.play().then(() => { shutter.pause(); shutter.currentTime = 0; });
}, { once: true });

/* Tap live window to capture */
document.getElementById("live-window").addEventListener("click", capture);

function capture() {
  shutter.currentTime = 0;
  shutter.play();

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  // Mirror selfie
  ctx.save();
  ctx.scale(-1,1);
  ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
  ctx.restore();

  // Draw overlay photo full-size
  if (overlay.complete) {
    ctx.drawImage(overlay, 0, 0, canvas.width, canvas.height);
  }

  // Draw header text
  ctx.font = `${canvas.width * 0.06}px "Dancing Script", cursive`;
  ctx.fillStyle = "#ffffff";
  ctx.textAlign = "center";
  ctx.fillText(headerText.split("\n")[0], canvas.width/2, canvas.height*0.08);
  ctx.fillText(headerText.split("\n")[1], canvas.width/2, canvas.height*0.15);

  // Draw footer date/time
  const now = new Date();
  const options = { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false };
  ctx.font = `${canvas.width * 0.04}px Helvetica`;
  ctx.fillStyle = "#ffffff";
  ctx.fillText(now.toLocaleString(undefined, options), canvas.width/2, canvas.height - canvas.height*0.05);

  // Photo is ready in canvas
  // No auto-download
  console.log("Captured photo is ready in canvas.");
}

/* Footer live date/time */
function updateFooterDateTime() {
  const now = new Date();
  const options = { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false };
  footer.textContent = now.toLocaleString(undefined, options);
}
updateFooterDateTime();
setInterval(updateFooterDateTime, 60000);
</script>

</body>
</html>
